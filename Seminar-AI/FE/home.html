<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vietnamese Sentiment Analyzer</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="homeStyle.css">
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <div class="title">
        <h1>Vietnamese Sentiment Analyzer</h1>
        <p>Phân tích cảm xúc tiếng Việt — chạy local (FastAPI + PhoBERT). Hỗ trợ đổi model khi cần.</p>
      </div>
      <div style="min-width:220px;text-align:right">
        <div class="muted">Status</div>
        <div id="srvStatus" style="font-weight:700">Checking...</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;gap:18px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <label class="small">Câu tiếng Việt</label>
          <textarea id="text" placeholder="Nhập câu... (hỗ trợ không dấu — server có thể chuẩn hóa)"></textarea>
          <div class="token muted" id="charCount">0 ký tự</div>
        </div>

        <div style="width:320px;min-width:220px">
          <label class="small">Model (tùy chọn)</label>
          <select id="model">
            <option value="">Use default (server)</option>
            <option value="wonrax/phobert-base-vietnamese-sentiment">wonrax/phobert-base-vietnamese-sentiment</option>
            <option value="vinai/phobert-base">vinai/phobert-base</option>
          </select>

          <div style="margin-top:12px;display:flex;gap:10px">
            <button id="btnAnalyze" class="btn primary">Phân tích</button>
            <button id="btnHistory" class="btn ghost">Làm mới lịch sử</button>
            <button id="btnDownload" class="btn ghost right">Tải CSV</button>
          </div>

          <div style="margin-top:12px" class="muted">Kết quả nhanh sẽ hiển thị bên dưới.</div>
        </div>
      </div>

      <div id="output" class="result" style="display:none">
        <div class="meta">
          <div><strong>Text:</strong> <span id="outText"></span></div>
          <div style="margin-top:8px">
            <span id="outBadge" class="badge"></span>
            <span style="margin-left:12px"><strong>Score:</strong> <span id="outScore"></span></span>
          </div>
          <div id="outToken" class="token"></div>
        </div>
        <div style="min-width:120px;text-align:right">
          <div class="muted">Model</div>
          <div id="outModel" style="font-weight:700"></div>
        </div>
      </div>

      <div class="history">
        <h3 style="margin:14px 0 8px">History (recent)</h3>
        <table id="historyTable" aria-live="polite">
          <thead>
            <tr>
              <th>#</th>
              <th>Text</th>
              <th>Tokenized Text</th>
              <th>Label</th>
              <th>Score</th>
              <th>Time (UTC)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="homeScript.js"></script>
</body>

</html>
